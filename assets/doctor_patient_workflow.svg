<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="420">
  <defs>
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111e38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1224" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      <![CDATA[
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      /* Data Pipeline Animations */
      .pipeline-track {
        stroke: rgba(56, 189, 248, 0.2);
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
      }
      
      .active-pulse {
        fill: #38bdf8;
        filter: url(#neonPulse);
        animation: travelPulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .active-pulse-ayush {
        fill: #22c55e;
        filter: url(#neonPulse);
        animation: travelPulse 3s cubic-bezier(0.4, 0, 0.2, 1) 1.5s infinite;
      }

      @keyframes travelPulse {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(290px); opacity: 0; }
      }

      /* Stethoscope & Pulse Monitor */
      .stetho-pulse {
        animation: heartThrob 1.2s ease-in-out infinite;
        transform-origin: 820px 150px;
      }

      @keyframes heartThrob {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8)); }
      }

      /* Audio Waves */
      .wave-bar-1 { animation: waveScale 1s ease-in-out infinite; transform-origin: bottom; }
      .wave-bar-2 { animation: waveScale 1s ease-in-out 0.2s infinite; transform-origin: bottom; }
      .wave-bar-3 { animation: waveScale 1s ease-in-out 0.4s infinite; transform-origin: bottom; }
      .wave-bar-4 { animation: waveScale 1s ease-in-out 0.6s infinite; transform-origin: bottom; }

      @keyframes waveScale {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }

      /* Radar Scan Line */
      .scan-beam {
        stroke: #38bdf8;
        stroke-width: 2;
        animation: scanPrescription 2.4s ease-in-out infinite alternate;
      }

      @keyframes scanPrescription {
        0% { transform: translateY(0); opacity: 0.2; }
        50% { opacity: 1; }
        100% { transform: translateY(55px); opacity: 0.2; }
      }

      /* Badge Blink */
      .blink-dot {
        animation: dotBlink 1.5s ease-in-out infinite;
      }

      @keyframes dotBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      ]]>
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="420" rx="20" fill="url(#mainBg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(30, 24)">
    <circle cx="12" cy="12" r="6" fill="#22c55e" class="blink-dot" />
    <text x="28" y="16" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
      AUTONOMOUS CLINICAL WORKFLOW: PATIENT INTAKE TO DOCTOR CONSULTATION
    </text>
    <rect x="760" y="0" width="180" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)"/>
    <text x="778" y="16" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">LATENCY: &lt; 2.5 MINUTES</text>
  </g>

  <!-- ==================== LEFT CARD: PATIENT KIOSK ==================== -->
  <g transform="translate(30, 65)">
    <rect width="290" height="320" rx="16" fill="url(#cardBg)" stroke="rgba(56, 189, 248, 0.3)" filter="url(#cardGlow)" />
    
    <!-- Header -->
    <rect x="16" y="16" width="258" height="34" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.25)"/>
    <text x="28" y="38" class="font-sans" font-size="13" font-weight="700" fill="#38bdf8">🖥️ PATIENT KIOSK (मेडीकियोस्क)</text>

    <!-- ABHA Verification -->
    <rect x="16" y="60" width="258" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)"/>
    <circle cx="34" cy="81" r="10" fill="#0284c7"/>
    <text x="31" y="85" class="font-sans" font-size="11" font-weight="700" fill="#fff">🪪</text>
    <text x="52" y="76" class="font-sans" font-size="11" font-weight="600" fill="#e2e8f0">ABHA: 91-8472-9102-3841</text>
    <text x="52" y="92" class="font-sans" font-size="9" fill="#22c55e">✓ ABDM Milestone-1 Verified</text>

    <!-- Multilingual Voice Engine with Animated Audio Waves -->
    <rect x="16" y="112" width="258" height="84" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="28" y="132" class="font-sans" font-size="11" font-weight="700" fill="#f1f5f9">🎙️ Bhashini Voice Intake (भोजपुरी / हिंदी)</text>
    
    <!-- Audio Wave Animation Bars -->
    <g transform="translate(28, 175)">
      <rect x="0" y="-30" width="4" height="30" rx="2" fill="#38bdf8" class="wave-bar-1"/>
      <rect x="8" y="-30" width="4" height="30" rx="2" fill="#38bdf8" class="wave-bar-2"/>
      <rect x="16" y="-30" width="4" height="30" rx="2" fill="#22c55e" class="wave-bar-3"/>
      <rect x="24" y="-30" width="4" height="30" rx="2" fill="#38bdf8" class="wave-bar-4"/>
      <rect x="32" y="-30" width="4" height="30" rx="2" fill="#22c55e" class="wave-bar-1"/>
      <rect x="40" y="-30" width="4" height="30" rx="2" fill="#a855f7" class="wave-bar-2"/>
      <rect x="48" y="-30" width="4" height="30" rx="2" fill="#38bdf8" class="wave-bar-3"/>
      <rect x="56" y="-30" width="4" height="30" rx="2" fill="#22c55e" class="wave-bar-4"/>
    </g>
    <text x="96" y="156" class="font-sans" font-size="10" fill="#94a3b8">"छाती में भारीपन आ दर्द बा..."</text>
    <text x="96" y="172" class="font-sans" font-size="9" fill="#38bdf8">Transcribing &amp; Structuring...</text>

    <!-- OCR Prescription Scan with Laser Animation -->
    <rect x="16" y="206" width="258" height="96" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="28" y="226" class="font-sans" font-size="11" font-weight="700" fill="#f1f5f9">📑 Vision OCR Prescription Digitizer</text>
    
    <!-- Scanned Prescription Document -->
    <g transform="translate(28, 236)">
      <rect width="234" height="56" rx="4" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)"/>
      <line x1="10" y1="14" x2="140" y2="14" stroke="#64748b" stroke-width="2"/>
      <line x1="10" y1="26" x2="200" y2="26" stroke="#475569" stroke-width="2"/>
      <line x1="10" y1="38" x2="160" y2="38" stroke="#475569" stroke-width="2"/>
      <!-- Animated Scan Beam -->
      <line x1="4" y1="0" x2="230" y2="0" class="scan-beam"/>
    </g>
  </g>

  <!-- ==================== MIDDLE PIPELINE: AI REASONING ==================== -->
  <g transform="translate(320, 110)">
    <!-- Connecting Stream Lines -->
    <path d="M 0,90 L 150,90" class="pipeline-track" />
    <path d="M 210,90 L 360,90" class="pipeline-track" />

    <!-- Active traveling energy particles -->
    <g transform="translate(0, 90)">
      <circle r="5" class="active-pulse" />
      <circle r="4" class="active-pulse-ayush" />
    </g>

    <!-- Central AI Reasoning Hub Core -->
    <g transform="translate(145, 45)">
      <circle cx="35" cy="45" r="42" fill="url(#cardBg)" stroke="url(#beamGrad)" stroke-width="2.5" filter="url(#cardGlow)"/>
      <text x="35" y="38" text-anchor="middle" class="font-sans" font-size="20">🧠</text>
      <text x="35" y="55" text-anchor="middle" class="font-sans" font-size="10" font-weight="800" fill="#38bdf8">CLINICAL</text>
      <text x="35" y="68" text-anchor="middle" class="font-sans" font-size="9" font-weight="700" fill="#22c55e">AI ENGINE</text>
    </g>

    <!-- Dual Schema Pill: SOCRATES + AYUSH -->
    <g transform="translate(115, 140)">
      <rect width="130" height="26" rx="6" fill="#1e293b" stroke="rgba(168, 85, 247, 0.4)"/>
      <text x="65" y="17" text-anchor="middle" class="font-sans" font-size="10" font-weight="700" fill="#c084fc">
        SOCRATES + AYUSH
      </text>
    </g>

    <!-- Red Flag Triage Alert Badge -->
    <g transform="translate(100, 175)">
      <rect width="160" height="28" rx="14" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="16" cy="14" r="5" fill="#ef4444" class="blink-dot"/>
      <text x="28" y="18" class="font-sans" font-size="10" font-weight="800" fill="#fca5a5">🚨 RED FLAG TRIAGE</text>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: DOCTOR OPD COCKPIT ==================== -->
  <g transform="translate(680, 65)">
    <rect width="290" height="320" rx="16" fill="url(#cardBg)" stroke="rgba(34, 197, 94, 0.35)" filter="url(#cardGlow)" />

    <!-- Header -->
    <rect x="16" y="16" width="258" height="34" rx="8" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.25)"/>
    <text x="28" y="38" class="font-sans" font-size="13" font-weight="700" fill="#22c55e">👨‍⚕️ DOCTOR OPD COCKPIT</text>

    <!-- Doctor Stethoscope Pulse & Vitals HUD -->
    <g transform="translate(16, 60)">
      <rect width="258" height="68" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)"/>
      
      <!-- Stethoscope Icon Pulsing -->
      <g class="stetho-pulse" transform="translate(16, 12)">
        <circle cx="18" cy="18" r="16" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="10" y="24" class="font-sans" font-size="16">🩺</text>
      </g>

      <!-- Vitals Telemetry Numbers -->
      <text x="60" y="26" class="font-sans" font-size="11" font-weight="700" fill="#f8fafc">PATIENT VITALS HUD</text>
      
      <!-- Vital Chips -->
      <g transform="translate(60, 36)">
        <rect width="60" height="22" rx="4" fill="#1e293b" stroke="rgba(239, 68, 68, 0.4)"/>
        <text x="6" y="15" class="font-sans" font-size="9" font-weight="700" fill="#f87171">BP: 154/96</text>

        <rect x="66" y="0" width="55" height="22" rx="4" fill="#1e293b" stroke="rgba(34, 197, 94, 0.4)"/>
        <text x="72" y="15" class="font-sans" font-size="9" font-weight="700" fill="#4ade80">HR: 104</text>

        <rect x="127" y="0" width="60" height="22" rx="4" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)"/>
        <text x="133" y="15" class="font-sans" font-size="9" font-weight="700" fill="#38bdf8">SpO2: 96%</text>
      </g>
    </g>

    <!-- Structured SOCRATES Intake Preview -->
    <g transform="translate(16, 138)">
      <rect width="258" height="74" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)"/>
      <text x="12" y="18" class="font-sans" font-size="10" font-weight="700" fill="#38bdf8">EXTRACTED SOCRATES CLINICAL DOSSIER</text>
      
      <text x="12" y="34" class="font-sans" font-size="9" fill="#e2e8f0">• Site: Precordial (Chest) | Severity: 8/10</text>
      <text x="12" y="48" class="font-sans" font-size="9" fill="#e2e8f0">• Radiation: Left Arm &amp; Mandible</text>
      <text x="12" y="62" class="font-sans" font-size="9" fill="#fca5a5">• Dx: Suspected Acute Coronary Syndrome (ACS)</text>
    </g>

    <!-- Actions: Print Slip & ABDM Push -->
    <g transform="translate(16, 222)">
      <!-- 1-Page A4 Print Button -->
      <rect width="122" height="34" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="61" y="22" text-anchor="middle" class="font-sans" font-size="10" font-weight="700" fill="#f8fafc">
        🖨️ A4 Print Slip
      </text>

      <!-- ABDM M2 Push Button -->
      <rect x="134" y="0" width="124" height="34" rx="6" fill="#0284c7" stroke="rgba(56, 189, 248, 0.5)"/>
      <text x="196" y="22" text-anchor="middle" class="font-sans" font-size="10" font-weight="700" fill="#ffffff">
        🌐 ABDM M2 Push
      </text>
    </g>

    <!-- Status Bar -->
    <g transform="translate(16, 268)">
      <rect width="258" height="24" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.25)"/>
      <circle cx="12" cy="12" r="3.5" fill="#a855f7" class="blink-dot"/>
      <text x="24" y="16" class="font-sans" font-size="9" font-weight="600" fill="#d8b4fe">
        HL7 FHIR R4 Bundle Generated (v4.0.1)
      </text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(30, 396)">
    <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#64748b">
      ⚡ AI Pipeline: Bhashini Voice ASR ➔ SOCRATES Reasoning ➔ Triage Radar ➔ FHIR R4 Ingestion
    </text>
    <text x="940" y="12" text-anchor="end" class="font-sans" font-size="11" font-weight="700" fill="#22c55e">
      ● ZERO-TOUCH DATA SYNCHRONIZATION
    </text>
  </g>
</svg>
